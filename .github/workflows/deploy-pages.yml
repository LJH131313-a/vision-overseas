name: 部署网站到 GitHub Pages

# 推送到 main 或手动运行时：启用并部署 GitHub Pages，同时执行一次新闻采集（验证云端管线）
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 采集最新新闻（失败时保留快照，不阻断部署）
        run: python tools/collect_news.py
        continue-on-error: true

      - name: 配置并启用 GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: 上传网站文件
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
